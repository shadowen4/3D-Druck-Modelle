<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ✏️ Titel im Browser-Tab: -->
  <title>Atelier 3D – Ausgewählte Drucke</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#262b36; --text:#e8eaf0; --accent:#ff6b2c; --muted:#8b91a1; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    nav { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center;
          padding:14px 24px; background:rgba(15,17,21,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
    nav strong { font-size:1.1rem; }
    nav strong span { color:var(--accent); }
    nav a { color:var(--muted); text-decoration:none; margin-left:20px; font-size:.95rem; }
    nav a:hover { color:var(--text); }
    .hero { text-align:center; padding:80px 20px 48px; max-width:720px; margin:0 auto; }
    .hero h1 { font-size:2.4rem; line-height:1.2; }
    .hero h1 span { color:var(--accent); }
    .hero p { color:var(--muted); margin-top:16px; font-size:1.05rem; }
    .btn { display:inline-block; margin-top:28px; padding:12px 26px; background:var(--accent); color:#fff;
           border:none; border-radius:8px; font-size:1rem; font-weight:600; text-decoration:none; cursor:pointer; }
    .btn:hover { opacity:.9; }
    section { max-width:1000px; margin:0 auto; padding:40px 20px; }
    section h2 { font-size:1.6rem; margin-bottom:6px; }
    .sub { color:var(--muted); margin-bottom:24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:transform .2s, border-color .2s; }
    .card:hover { transform:translateY(-4px); border-color:var(--accent); }
    .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#242833; }
    .card div { padding:14px 16px 18px; }
    .card h3 { font-size:1.1rem; }
    .card p { color:var(--muted); font-size:.9rem; margin-top:4px; }
    .card small { display:block; margin-top:10px; color:var(--accent); font-size:.85rem; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; padding:20px; z-index:100; }
    .modal.open { display:flex; }
    .modal-box { background:var(--card); border-radius:16px; max-width:820px; width:100%; max-height:92vh; overflow:auto; position:relative; }
    .modal-box img.main { width:100%; max-height:60vh; object-fit:contain; background:#000; display:block; }
    .thumbs { display:flex; gap:8px; padding:12px 20px 0; overflow-x:auto; }
    .thumbs img { width:64px; height:64px; object-fit:cover; border-radius:8px; cursor:pointer; opacity:.6; border:2px solid transparent; }
    .thumbs img.active { opacity:1; border-color:var(--accent); }
    .modal-text { padding:16px 24px 24px; }
    .modal-text h3 { font-size:1.4rem; }
    .modal-text p { color:var(--muted); margin-top:8px; }
    .close { position:absolute; top:10px; right:14px; background:rgba(0,0,0,.6); color:#fff; border:none; width:36px; height:36px; border-radius:50%; font-size:1.3rem; cursor:pointer; z-index:2; }
    form { display:grid; gap:14px; max-width:600px; }
    label { font-size:.9rem; color:var(--muted); display:grid; gap:6px; }
    input, select, textarea { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
    textarea { min-height:130px; resize:vertical; }
    #status { margin-top:10px; font-size:.95rem; }
    footer { text-align:center; color:var(--muted); padding:40px 20px; font-size:.85rem; border-top:1px solid var(--line); margin-top:40px; }
  </style>
</head>
<body>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  ✏️  BEARBEITUNGSBEREICH – NUR HIER MUSST DU ETWAS ÄNDERN    ║
   ╚══════════════════════════════════════════════════════════════╝
   Regeln: Texte stehen immer zwischen "Anführungszeichen".
   Anführungszeichen, Kommas und Klammern nicht löschen.
   Innerhalb eines Textes keine weiteren " verwenden.            */

/* ───────── 1) ALLGEMEINE TEXTE DER SEITE ───────── */
const SEITE = {
  logoText:        "Atelier",            // ✏️ Name oben links
  logoFarbig:      "3D",                 // ✏️ orangefarbener Teil des Namens

  ueberschrift:        "Präzise gefertigt.",        // ✏️ große Überschrift, weiß
  ueberschriftFarbig:  "Mit Liebe zum Detail.",     // ✏️ große Überschrift, orange
  einleitung: "Eine Auswahl meiner eigenen 3D-Drucke. Jedes Modell ist selbst gefertigt und getestet. Gefällt dir etwas oder hast du eine eigene Idee? Schreib mir.",  // ✏️ Text unter der Überschrift

  modelleTitel:    "Modelle",                                           // ✏️
  modelleHinweis:  "Tippe auf ein Modell, um weitere Bilder zu sehen.", // ✏️

  anfrageTitel:    "Anfrage senden",                                    // ✏️
  anfrageText:     "Du möchtest eines der Modelle oder ein ganz anderes Objekt gedruckt haben? Schreib mir kurz, worum es geht.",  // ✏️

  fussnote:        "Privates Hobbyprojekt · Kein Onlineshop",           // ✏️ Text ganz unten

  /* ✏️ FORMULAR-ADRESSE von formspree.io (siehe Anleitung).
     Ersetze DEINE_FORM_ID durch deine echte ID: */
  formularAdresse: "https://formspree.io/f/DEINE_FORM_ID"
};

/* ───────── 2) DEINE MODELLE ─────────
   Jedes Modell ist ein Block von { bis }.
   Neues Modell: einen ganzen Block kopieren, darunter einfügen
   und ein Komma hinter den Block davor setzen.

   bilder: Das ERSTE Bild ist das Titelbild auf der Karte.
   Dateinamen genau so schreiben wie im Ordner "fotos"
   (Groß-/Kleinschreibung beachten, z. B. .PNG ≠ .png).      */
const MODELLE = [

  {
    titel:        "Nussschale",                                  // ✏️ Name des Modells
    kurz:         "Selbst gefertigt im 3D-Druck.",               // ✏️ kurzer Text auf der Karte
    beschreibung: "Ein detailreich gedrucktes Modell, das ich selbst gefertigt habe. Hier kannst du später Maße, Material und Besonderheiten ergänzen.",  // ✏️ Text im Fenster
    bilder: [
      "fotos/modell1.PNG"                                        // ✏️ Bild 1 (Titelbild)
      // , "fotos/modell1-2.PNG"                                 // ✏️ weitere Bilder: Zeichen // vorne entfernen
    ]
  }

  // , { ... }   ← ✏️ hier kommt dein nächstes Modell hin (Beispiel unten)
  /*
  ,{
    titel:        "Nächstes Modell",
    kurz:         "Kurzer Text.",
    beschreibung: "Längere Beschreibung.",
    bilder: [ "fotos/modell2.PNG", "fotos/modell2-2.PNG" ]
  }
  */

];

/* ╔══════════════════════════════════════════════════════════════╗
   ║  ENDE DES BEARBEITUNGSBEREICHS                               ║
   ╚══════════════════════════════════════════════════════════════╝ */
</script>

  <nav>
    <strong><span id="logoText"></span> <span id="logoFarbig"></span></strong>
    <div>
      <a href="#modelle" id="navModelle"></a>
      <a href="#anfrage">Anfrage</a>
    </div>
  </nav>

  <header class="hero">
    <h1><span id="ueb1" style="color:var(--text)"></span> <span id="ueb2"></span></h1>
    <p id="einleitung"></p>
    <a class="btn" href="#modelle">Modelle ansehen</a>
  </header>

  <section id="modelle">
    <h2 id="modelleTitel"></h2>
    <p class="sub" id="modelleHinweis"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="anfrage">
    <h2 id="anfrageTitel"></h2>
    <p class="sub" id="anfrageText"></p>

    <form id="kontakt" method="POST">
      <label>Name
        <input type="text" name="name" required>
      </label>
      <label>E-Mail-Adresse
        <input type="email" name="email" required>
      </label>
      <label>Worum geht es?
        <select name="art">
          <option>Modell von dieser Seite</option>
          <option>Eigenes Objekt / Sonderwunsch</option>
          <option>Allgemeine Frage</option>
        </select>
      </label>
      <label>Nachricht
        <textarea name="nachricht" required placeholder="Welches Modell, welche Größe, welche Farbe …?"></textarea>
      </label>
      <button class="btn" type="submit">Anfrage absenden</button>
      <p id="status"></p>
    </form>
  </section>

  <footer id="fussnote"></footer>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="close" id="close" aria-label="Schließen">×</button>
      <img class="main" id="mainImg" src="" alt="">
      <div class="thumbs" id="thumbs"></div>
      <div class="modal-text">
        <h3 id="mTitle"></h3>
        <p id="mDesc"></p>
        <a class="btn" href="#anfrage" id="mAsk">Dieses Modell anfragen</a>
      </div>
    </div>
  </div>

  <script>
    /* ── Ab hier ist die Technik. Normalerweise nichts ändern. ── */

    // Texte einsetzen
    const setText = (id, t) => { document.getElementById(id).textContent = t; };
    setText('logoText', SEITE.logoText);
    setText('logoFarbig', SEITE.logoFarbig);
    setText('navModelle', SEITE.modelleTitel);
    setText('ueb1', SEITE.ueberschrift);
    setText('ueb2', SEITE.ueberschriftFarbig);
    setText('einleitung', SEITE.einleitung);
    setText('modelleTitel', SEITE.modelleTitel);
    setText('modelleHinweis', SEITE.modelleHinweis);
    setText('anfrageTitel', SEITE.anfrageTitel);
    setText('anfrageText', SEITE.anfrageText);
    setText('fussnote', SEITE.fussnote);

    // Karten bauen
    const grid = document.getElementById('grid');
    MODELLE.forEach(m => {
      const card = document.createElement('article');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = m.bilder[0]; img.alt = m.titel;
      const box = document.createElement('div');
      const h = document.createElement('h3'); h.textContent = m.titel;
      const p = document.createElement('p'); p.textContent = m.kurz;
      const s = document.createElement('small'); s.textContent = 'Mehr ansehen →';
      box.append(h, p, s);
      card.append(img, box);
      card.addEventListener('click', () => openModal(m));
      grid.appendChild(card);
    });

    // Galerie-Fenster
    const modal = document.getElementById('modal');
    const mainImg = document.getElementById('mainImg');
    const thumbs = document.getElementById('thumbs');

    function openModal(m) {
      setText('mTitle', m.titel);
      setText('mDesc', m.beschreibung);
      mainImg.src = m.bilder[0];
      mainImg.alt = m.titel;
      thumbs.innerHTML = '';
      if (m.bilder.length > 1) {
        m.bilder.forEach((src, i) => {
          const t = document.createElement('img');
          t.src = src;
          t.alt = m.titel + ' Bild ' + (i + 1);
          if (i === 0) t.classList.add('active');
          t.onclick = () => {
            mainImg.src = src;
            thumbs.querySelectorAll('img').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
          };
          thumbs.appendChild(t);
        });
      }
      modal.classList.add('open');
    }
    function closeModal() { modal.classList.remove('open'); }
    document.getElementById('close').onclick = closeModal;
    document.getElementById('mAsk').onclick = closeModal;
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // Formular
    const form = document.getElementById('kontakt');
    const status = document.getElementById('status');
    form.action = SEITE.formularAdresse;
    form.addEventListener('submit', async e => {
      e.preventDefault();
      status.textContent = 'Wird gesendet …';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) { status.textContent = 'Danke! Deine Anfrage ist angekommen.'; form.reset(); }
        else { status.textContent = 'Das hat leider nicht geklappt. Bitte versuch es später noch einmal.'; }
      } catch (err) {
        status.textContent = 'Verbindungsfehler. Bitte versuch es später noch einmal.';
      }
    });
  </script>
</body>
</html>
